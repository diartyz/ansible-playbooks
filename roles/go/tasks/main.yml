---
- name: install packages and binaries
  include_role:
    name: pkg
  vars:
    packages_archlinux:
      - go
    packages_macos:
      - go
    binaries:
      - check: go
        urls:
          linux-x64: https://go.dev/dl/go1.27.0.linux-amd64.tar.gz
          macos-x64: https://go.dev/dl/go1.27.0.darwin-amd64.tar.gz
          macos-arm64: https://go.dev/dl/go1.27.0.darwin-arm64.tar.gz
        install: >-
          rm -rf ~/.local/go
          && tar -C ~/.local -xzf $CACHE_FILE

- name: configure go environment
  lineinfile:
    path: "~/.{{ item[0] }}rc"
    line: "{{ item[1].line }}"
    insertafter: "{{ item[1].after }}"
    create: true
  loop: >-
    {{ ['zsh', 'bash'] | product([
      { 'line': 'export PATH=$HOME/.local/go/bin:$HOME/go/bin:$PATH', 'after': '^export PATH' },
      { 'line': 'export GOPROXY=https://goproxy.cn', 'after': '^export (?!PATH)' }
    ]) | list }}
