---
- name: install packages and binaries
  include_role:
    name: pkg
  vars:
    packages:
      - git
      - tig
    packages_archlinux:
      - git-delta
      - github-cli
      - lazygit
      - meld
    packages_macos:
      - gh
      - git-delta
      - lazygit
    packages_cask:
      - meld
    binaries:
      - check: gh
        urls:
          linux-x64: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_linux_amd64.tar.gz
          macos-x64: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_macOS_amd64.zip
          macos-arm64: https://github.com/cli/cli/releases/download/v2.98.0/gh_2.98.0_macOS_arm64.zip
        install: >-
          if [ "{{ bin_os }}" = macos ]; then
            unzip -o $CACHE_FILE -d /tmp/gh
            && install /tmp/gh/$CACHE_STEM/bin/gh ~/.local/bin/gh;
          else
            tar -xzf $CACHE_FILE --strip-components=1 -C ~/.local;
          fi
      - check: lazygit
        urls:
          linux-x64: https://github.com/jesseduffield/lazygit/releases/download/v0.64.1/lazygit_0.64.1_linux_x86_64.tar.gz
          macos-x64: https://github.com/jesseduffield/lazygit/releases/download/v0.64.1/lazygit_0.64.1_darwin_x86_64.tar.gz
          macos-arm64: https://github.com/jesseduffield/lazygit/releases/download/v0.64.1/lazygit_0.64.1_darwin_arm64.tar.gz
        install: >-
          tar -xzf $CACHE_FILE -C /tmp
          && install /tmp/lazygit ~/.local/bin/lazygit
      - check: delta
        urls:
          linux-x64: https://github.com/dandavison/delta/releases/download/0.19.2/delta-0.19.2-x86_64-unknown-linux-musl.tar.gz
          macos-x64: https://github.com/dandavison/delta/releases/download/0.19.2/delta-0.19.2-x86_64-apple-darwin.tar.gz
          macos-arm64: https://github.com/dandavison/delta/releases/download/0.19.2/delta-0.19.2-aarch64-apple-darwin.tar.gz
        install: >-
          tar -xzf $CACHE_FILE -C /tmp
          && install /tmp/$CACHE_STEM/delta ~/.local/bin/delta

- name: check gh available
  command: which gh
  register: gh_available
  failed_when: false
  changed_when: false

- name: check gh auth status
  command: gh auth status
  register: gh_auth_check
  failed_when: false
  changed_when: false
  when: gh_available.rc == 0

- name: authenticate gh
  shell: echo '{{ gh_token }}' | gh auth login --with-token
  when:
    - gh_available.rc == 0
    - gh_auth_check.rc != 0

- name: check gh git protocol
  command: gh config get git_protocol
  register: gh_git_protocol
  changed_when: false
  when: gh_available.rc == 0

- name: set gh git protocol to ssh
  command: gh config set git_protocol ssh
  when:
    - gh_available.rc == 0
    - gh_git_protocol.stdout | default('') != 'ssh'

- name: add git alias to shell rc
  lineinfile:
    path: "~/.{{ item }}rc"
    line: 'alias lg="lazygit"'
    insertafter: '^alias'
    create: true
  loop:
    - zsh
    - bash

- name: add git plugins to zshrc
  lineinfile:
    path: ~/.zshrc
    line: "plugins+=({{ item }})"
    insertbefore: '# BEGIN ANSIBLE MANAGED OH-MY-ZSH'
    create: true
  loop:
    - git
    - git-flow-avh

- name: get git version
  command: git --version
  register: git_version_output
  changed_when: false

- name: template .gitconfig
  vars:
    conflict_style: "{{ 'zdiff3' if git_version_output.stdout | regex_replace('git version ', '') is version('2.35', '>=') else 'diff3' }}"
    meld: "{{ '/Applications/Meld.app/Contents/MacOS/Meld' if ansible_facts.distribution == 'MacOSX' else ('meld.exe' if ansible_facts.kernel.find('microsoft-standard-WSL2') != -1 else 'meld') }}"
  template:
    src: .gitconfig
    dest: ~/.gitconfig

- name: create lazygit conf folder
  file:
    path: "{{ '~/Library/Application Support/lazygit' if ansible_facts.distribution == 'MacOSX' else '~/.config/lazygit' }}"
    state: directory

- name: create .gitconfig.local
  copy:
    dest: ~/.gitconfig.local
    content: ''
    force: no

- name: copy git config
  copy:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
  loop:
    - src: .gitconfig-me
      dest: ~/.gitconfig-me
    - src: .gitconfig-work
      dest: ~/.gitconfig-work
    - src: .gitconfig-zenvy
      dest: ~/.gitconfig-zenvy

- name: copy lazygit config
  copy:
    src: lazygit.yml
    dest: "{{ '~/Library/Application Support/lazygit/config.yml' if ansible_facts.distribution == 'MacOSX' else '~/.config/lazygit/config.yml' }}"
