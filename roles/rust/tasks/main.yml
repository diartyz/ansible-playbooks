---
- name: install packages and binaries
  include_role:
    name: pkg
  vars:
    packages_archlinux:
      - rustup
    packages_macos:
      - rustup
    binaries:
      - check: rustc
        urls:
          linux-x64: https://static.rust-lang.org/dist/rust-1.98.0-x86_64-unknown-linux-gnu.tar.gz
          macos-x64: https://static.rust-lang.org/dist/rust-1.98.0-x86_64-apple-darwin.tar.gz
          macos-arm64: https://static.rust-lang.org/dist/rust-1.98.0-aarch64-apple-darwin.tar.gz
        install: >-
          tar -xzf $CACHE_FILE -C /tmp
          && /tmp/$CACHE_STEM/install.sh --prefix=~/.local --disable-ldconfig

- name: add cargo/bin to PATH
  lineinfile:
    path: "~/.{{ item }}rc"
    line: 'export PATH=$HOME/.cargo/bin:$PATH'
    insertafter: '^export PATH'
    create: true
  loop:
    - zsh
    - bash

- name: create cargo conf folder
  file:
    path: ~/.cargo
    state: directory

- name: copy cargo conf
  copy:
    src: config.toml
    dest: ~/.cargo/config.toml
